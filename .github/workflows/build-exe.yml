name: Auto-Update Build & Release (.EXE)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Auto-Bump Version & Publish Auto-Update Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $baseVer = $pkg.version -replace '\.\d+$', ''
          $newVer = "$baseVer.${{ github.run_number }}"
          npm version $newVer --no-git-tag-version --allow-same-version
          npx electron-builder --win nsis portable --publish always
