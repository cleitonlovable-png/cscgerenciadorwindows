name: Build Windows EXE & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Portable EXE
        run: npm run build:exe

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSC-Gerenciador-Portable
          path: dist/CSC-Gerenciador-Portable.exe

      - name: Publish GitHub Release with EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: CSC Gerenciador Windows v1.0.0 (.EXE)
          files: dist/CSC-Gerenciador-Portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
